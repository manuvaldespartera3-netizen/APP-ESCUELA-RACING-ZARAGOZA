<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test Login</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;}
.box{background:#222;padding:30px;border-radius:12px;width:100%;max-width:360px;}
h2{text-align:center;margin-bottom:20px;color:#4a90d9;}
input{width:100%;padding:12px;margin:8px 0;background:#333;border:1px solid #444;border-radius:8px;color:#fff;font-size:15px;box-sizing:border-box;}
button{width:100%;padding:14px;background:#1a4a8a;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
#log{margin-top:16px;font-size:13px;line-height:1.8;}
.ok{color:#25a352;}
.err{color:#e03c3c;}
.info{color:#4a90d9;}
</style>
</head>
<body>
<div class="box">
  <h2>Test Firebase Login</h2>
  <input type="email" id="email" placeholder="Tu email" value="">
  <input type="password" id="pass" placeholder="Tu contraseña">
  <button id="btn">Entrar</button>
  <div id="log"></div>
</div>

<script>
function log(msg, tipo) {
  var el = document.getElementById("log");
  el.innerHTML += '<div class="' + (tipo||"info") + '">' + msg + '</div>';
}

log("Paso 1: HTML cargado ✅");

// Cargar Firebase dinámicamente
var script1 = document.createElement("script");
script1.type = "module";
script1.textContent = [
  'import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";',
  'import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";',
  'document.getElementById("log").innerHTML += \'<div class="ok">Paso 2: Firebase importado ✅</div>\';',
  'var app = initializeApp({',
  '  apiKey: "AIzaSyAKHHJ-7fT-KS0F0CTvtVgssxCQcAhBIs8",',
  '  authDomain: "escuela-racing-zaragoza.firebaseapp.com",',
  '  projectId: "escuela-racing-zaragoza",',
  '  storageBucket: "escuela-racing-zaragoza.firebasestorage.app",',
  '  messagingSenderId: "862620560075",',
  '  appId: "1:862620560075:web:51c178f8893bbd5fb1494e"',
  '});',
  'var auth = getAuth(app);',
  'document.getElementById("log").innerHTML += \'<div class="ok">Paso 3: Firebase inicializado ✅</div>\';',
  'document.getElementById("btn").addEventListener("click", function() {',
  '  var email = document.getElementById("email").value.trim();',
  '  var pass = document.getElementById("pass").value;',
  '  document.getElementById("log").innerHTML += \'<div class="info">Paso 4: Botón pulsado ✅ Intentando login...</div>\';',
  '  signInWithEmailAndPassword(auth, email, pass)',
  '    .then(function(c) {',
  '      document.getElementById("log").innerHTML += \'<div class="ok">✅ LOGIN CORRECTO: \' + c.user.email + \'</div>\';',
  '    })',
  '    .catch(function(e) {',
  '      document.getElementById("log").innerHTML += \'<div class="err">❌ Error login: \' + e.code + \' - \' + e.message + \'</div>\';',
  '    });',
  '});',
  'document.getElementById("log").innerHTML += \'<div class="ok">Paso 4: Botón listo ✅ Puedes intentar el login</div>\';'
].join("\n");

document.body.appendChild(script1);

script1.onerror = function() {
  log("❌ Error cargando Firebase - problema de red o URL", "err");
};
</script>
</body>
</html>
